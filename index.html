<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE Echoes Planning Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="list">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">List View</span>
                </a>
            </nav>
            <div class="version">v1.0.0</div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="total-isk">
                    Total ISK: <span id="totalIsk">0</span>
                </div>
            </header>

            <div class="list-container">
                <ul id="planningList" class="planning-list">
                    <!-- Items will be added here -->
                </ul>
                <div class="add-item-container">
                    <button id="addItem" class="btn btn-primary">+ Add Item</button>
                </div>
            </div>

            <div class="empty-state" id="emptyState">
                <p>No items yet. Click "Add Item" to get started!</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
